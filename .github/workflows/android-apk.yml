name: Build KinPilot APK

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  # Never cancel a main build: every merged commit gets its own release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-apk:
    name: Build unified APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$current_tag" ]; then
            version_name="${current_tag#v}"
            IFS=. read -r major minor patch <<< "$version_name"
            version_code=$((major * 10000 + minor * 100 + patch))
            release_tag="$current_tag"
          else
            latest_tag="$(git tag --list 'v[0-9]*' | sort -V | tail -n 1)"
            read -r release_tag version_name version_code < <(python3 scripts/next_release_version.py "${latest_tag:-v0.0.0}")
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "KINPILOT_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "KINPILOT_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Test release version rollover
        run: python3 scripts/test_next_release_version.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build KinPilot APK
        working-directory: android
        run: gradle :protocol:testDebugUnitTest :parent:assembleDebug :helper:assembleDebug :parent:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Accessibility actions on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: gradle :parent:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/parent/build/reports/androidTests/
            android/protocol/build/reports/tests/

      - name: Prepare installable APK
        run: |
          mkdir -p artifacts
          cp android/parent/build/outputs/apk/debug/parent-debug.apk artifacts/KinPilot.apk
          (cd artifacts && sha256sum KinPilot.apk > KinPilot.apk.sha256)

      - name: Build signed distribution update
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          KINPILOT_KEYSTORE_BASE64: ${{ secrets.KINPILOT_KEYSTORE_BASE64 }}
          KINPILOT_STORE_PASSWORD: ${{ secrets.KINPILOT_STORE_PASSWORD }}
          KINPILOT_KEY_ALIAS: ${{ secrets.KINPILOT_KEY_ALIAS }}
          KINPILOT_KEY_PASSWORD: ${{ secrets.KINPILOT_KEY_PASSWORD }}
        run: |
          test -n "$KINPILOT_KEYSTORE_BASE64" || { echo 'Configure the persistent signing secrets described in docs/UPDATES.md before publishing.'; exit 1; }
          export KINPILOT_KEYSTORE="$RUNNER_TEMP/kinpilot-release.jks"
          trap 'rm -f "$KINPILOT_KEYSTORE"' EXIT
          printf '%s' "$KINPILOT_KEYSTORE_BASE64" | base64 --decode > "$KINPILOT_KEYSTORE"
          (cd android && gradle :parent:assembleRelease --no-daemon --stacktrace)
          cp android/parent/build/outputs/apk/release/parent-release.apk artifacts/KinPilot.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/KinPilot.apk
          (cd artifacts && sha256sum KinPilot.apk > KinPilot.apk.sha256)
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path
          metadata = json.loads(Path('android/parent/build/outputs/apk/release/output-metadata.json').read_text())
          apk = metadata['elements'][0]
          expected_name = os.environ.get('KINPILOT_VERSION_NAME')
          expected_code = os.environ.get('KINPILOT_VERSION_CODE')
          if expected_name:
              assert apk['versionName'] == expected_name, (apk['versionName'], expected_name)
          if expected_code:
              assert apk['versionCode'] == int(expected_code), (apk['versionCode'], expected_code)
          Path('artifacts/update.json').write_text(json.dumps({'versionCode': apk['versionCode'], 'versionName': apk['versionName']}))
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinPilot-${{ github.sha }}
          path: |
            artifacts/KinPilot.apk
            artifacts/KinPilot.apk.sha256
            artifacts/update.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or reuse GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --latest
          fi

      - name: Attach APK to GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/KinPilot.apk artifacts/KinPilot.apk.sha256 artifacts/update.json --clobber
