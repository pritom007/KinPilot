name: Build KinPilot APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-apk:
    name: Build unified APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build KinPilot APK
        working-directory: android
        run: gradle :protocol:testDebugUnitTest :parent:assembleDebug :helper:assembleDebug :parent:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Accessibility actions on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: gradle :parent:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/parent/build/reports/androidTests/
            android/protocol/build/reports/tests/

      - name: Prepare installable APK
        run: |
          mkdir -p artifacts
          cp android/parent/build/outputs/apk/debug/parent-debug.apk artifacts/KinPilot.apk
          (cd artifacts && sha256sum KinPilot.apk > KinPilot.apk.sha256)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinPilot-${{ github.sha }}
          path: |
            artifacts/KinPilot.apk
            artifacts/KinPilot.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create or reuse GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Attach APK to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/KinPilot.apk artifacts/KinPilot.apk.sha256 --clobber
