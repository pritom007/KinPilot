services:
  - type: web
    name: kinpilot-rendezvous
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGIN
        value: https://kinpilot.netlify.app
